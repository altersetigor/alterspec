<!doctype html>
<!-- Experience mockup of SCR-HR-01. Shape it freely, but keep every data-src, data-roles and data-show-in: the alignment checks read them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee record · Fixture People</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/components.css">
<script src="nav.js"></script>
</head>
<body data-screen="SCR-HR-01" data-roles="ROLE-HR-MANAGER" data-states="default empty no-permission validation">
<main class="ux-page" data-src="SCR-HR-01">
<header class="ux-page-header">
<div><p class="ux-breadcrumb">Employee records</p><h1 class="ux-page-title">Employee record</h1></div>
<div class="ux-actions">
<button type="button" class="ux-button ux-button-primary" data-src="SCR-HR-01.A01" data-action="Register: performs CAP-HR-001 Register employee">Register</button>
<button type="button" class="ux-button" data-src="SCR-HR-01.A02" data-action="Activate: performs CAP-HR-002 Activate employee">Activate</button>
<button type="button" class="ux-button" data-src="SCR-HR-01.A03" data-action="Record leaving: performs CAP-HR-003 Record employee leaving">Record leaving</button>
</div>
</header>
<div class="ux-state" data-src="SCR-HR-01.state.empty" data-show-in="empty">a new employee with nothing filled in.</div>
<div class="ux-state" data-src="SCR-HR-01.state.no-permission" data-show-in="no-permission">other roles are told the record is for HR only.</div>
<div class="ux-state ux-state-danger" data-src="SCR-HR-01.state.validation" data-show-in="validation">a missing full name or start date is named.</div>
<section class="ux-card ux-data" data-src="SCR-HR-01.ENT-EMPLOYEE">
<h2 class="ux-card-title">Employee</h2>
<form class="ux-form">
<div class="ux-field" data-src="SCR-HR-01.ENT-EMPLOYEE.Full name"><label class="ux-label" for="ent-employee-1">Full name <span class="ux-required">*</span></label><input id="ent-employee-1" class="ux-input" type="text" value="Full name 1"></div>
<div class="ux-field" data-src="SCR-HR-01.ENT-EMPLOYEE.Start date"><label class="ux-label" for="ent-employee-2">Start date <span class="ux-required">*</span></label><input id="ent-employee-2" class="ux-input" type="date" value="2026-02-05"></div>
<div class="ux-field" data-src="SCR-HR-01.ENT-EMPLOYEE.Contract type"><label class="ux-label" for="ent-employee-3">Contract type</label><select id="ent-employee-3" class="ux-input"><option selected>Permanent</option><option>Fixed term</option></select></div>
</form>
</section>
</main>
<script src="kit/shell.js"></script>
</body>
</html>
