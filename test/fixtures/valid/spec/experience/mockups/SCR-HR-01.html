<!doctype html>
<!-- SCR-HR-01: keep every data-src, data-roles and data-show-in; the alignment checks read them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee record · Fixture People</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/components.css">
</head>
<body data-screen="SCR-HR-01" data-roles="ROLE-HR-MANAGER" data-states="default empty no-permission validation">
<main class="ux-page" data-src="SCR-HR-01">
<header class="ux-page-header">
<div><nav class="ux-breadcrumb" aria-label="Breadcrumb"><span>Employee records</span><i data-icon="chevron-right"></i><span>Employee record</span><i data-icon="chevron-right" data-crumb-record hidden></i><span data-crumb-record hidden></span></nav>
<h1 class="ux-page-title">Employee record</h1></div>
</header>
<div class="ux-state" data-src="SCR-HR-01.state.empty" data-show-in="empty"><i data-icon="inbox"></i>a new employee with nothing filled in.</div>
<div class="ux-state" data-src="SCR-HR-01.state.no-permission" data-show-in="no-permission"><i data-icon="lock"></i>other roles are told the record is for HR only.</div>
<div class="ux-state ux-state-danger" data-src="SCR-HR-01.state.validation" data-show-in="validation"><i data-icon="alert-circle"></i>a missing full name or start date is named.</div>
<div class="ux-layout ux-layout-single">
<div class="ux-region" data-region="form">
<section class="ux-card ux-data" data-src="SCR-HR-01.ENT-EMPLOYEE" data-entity="ENT-EMPLOYEE" data-record>
<div class="ux-card-head"><h2 class="ux-card-title">Employee</h2></div>
<form class="ux-form" novalidate>
<div class="ux-field" data-src="SCR-HR-01.ENT-EMPLOYEE.Full name"><label class="ux-label" for="ent-employee-1">Full name <span class="ux-required">*</span></label><input id="ent-employee-1" class="ux-input" name="Full name" type="text" required><p class="ux-field-error">Enter full name.</p></div>
<div class="ux-field" data-src="SCR-HR-01.ENT-EMPLOYEE.Start date"><label class="ux-label" for="ent-employee-2">Start date <span class="ux-required">*</span></label><input id="ent-employee-2" class="ux-input" name="Start date" type="date" required><p class="ux-field-error">Enter start date.</p></div>
<div class="ux-field" data-src="SCR-HR-01.ENT-EMPLOYEE.Contract type"><label class="ux-label" for="ent-employee-3">Contract type</label><select id="ent-employee-3" class="ux-input" name="Contract type"><option value=""></option><option>Permanent</option><option>Fixed term</option></select></div>
</form>
</section>
<div class="ux-actions ux-form-actions">
<button type="button" class="ux-button ux-button-primary" data-src="SCR-HR-01.A01" data-effect="{&quot;op&quot;:&quot;create&quot;,&quot;entity&quot;:&quot;ENT-EMPLOYEE&quot;,&quot;toast&quot;:&quot;Employee created&quot;,&quot;show&quot;:&quot;SCR-HR-01&quot;}">Register</button>
<button type="button" class="ux-button" data-src="SCR-HR-01.A02" data-effect="{&quot;op&quot;:&quot;transition&quot;,&quot;entity&quot;:&quot;ENT-EMPLOYEE&quot;,&quot;from&quot;:&quot;draft&quot;,&quot;to&quot;:&quot;active&quot;,&quot;toast&quot;:&quot;Employee active&quot;}">Activate</button>
<button type="button" class="ux-button" data-src="SCR-HR-01.A03" data-effect="{&quot;op&quot;:&quot;transition&quot;,&quot;entity&quot;:&quot;ENT-EMPLOYEE&quot;,&quot;from&quot;:&quot;active&quot;,&quot;to&quot;:&quot;left&quot;,&quot;toast&quot;:&quot;Employee left&quot;,&quot;confirm&quot;:&quot;Record employee leaving?&quot;}">Record leaving</button>
</div>
</div>
</div>
</main>
<script src="config.js"></script>
<script src="../../_generated/experience/spec.js"></script>
<script src="data.js"></script>
<script src="kit/icons.js"></script>
<script src="kit/store.js"></script>
<script src="kit/ui.js"></script>
<script src="kit/app.js"></script>
</body>
</html>
