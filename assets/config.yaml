# alterspec project configuration. This file is yours: `alterspec update` never overwrites it.
version: "{{version}}"
language: en

lint:
  # Per-rule severity overrides: error | warn | off. Rule names arrive with the linter.
  rules: {}
  # Words the tech-leak check flags in spec content. Add or remove to suit your product.
  tech_terms:
    - database
    - varchar
    - uuid
    - endpoint
    - REST
    - GraphQL
    - JSON
    - XML
    - API call
    - microservice
    - Kafka
    - SQL
    - NoSQL
    - React
    - Angular
    - Spring
    - Node.js
    - Java
    - Python
    - TypeScript
    - Docker
    - Kubernetes
    - AWS
    - Azure
  # Words the profile-excluded check flags when the product profile rules a dimension out
  # (one currency, one language, single tenancy, one time zone). Tune them to your product.
  profile_terms:
    currency:
      - currency conversion
      - exchange rate
      - multi-currency
      - multiple currencies
    language:
      - translation
      - translate
      - translated
      - multilingual
      - multi-language
    tenant:
      - tenant
      - tenants
      - multi-tenant
    time_zone:
      - time zone
      - time zones
      - timezone
