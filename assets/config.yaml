    - varchar
    - uuid
    - endpoint
    - REST
    - GraphQL
    - JSON
    - XML
    - API call
    - microservice
    - Kafka
    - SQL
    - NoSQL
    - React
    - Angular
    - Spring
    - Node.js
    - Java
    - Python
    - TypeScript
    - Docker
    - Kubernetes
    - AWS
    - Azure
