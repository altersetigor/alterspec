# alterspec project configuration. This file is yours: `alterspec update` never overwrites it.
version: "{{version}}"
language: en

lint:
  # Per-rule severity overrides: error | warn | off. Rule names arrive with the linter.
  rules: {}
  # Words the tech-leak check flags in spec content. Add or remove to suit your product.
  tech_terms:
